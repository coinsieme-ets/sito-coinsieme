<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Il non profit cresce. L'inclusione rallenta.</title>
  <desc id="desc">Infografica COINSIEME sui dati ISTAT 2024 e INPS relativi ai lavoratori svantaggiati nelle cooperative sociali.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F3EA"/>
      <stop offset="1" stop-color="#EEF5F1"/>
    </linearGradient>
    <linearGradient id="leftCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B5D61"/>
      <stop offset="1" stop-color="#167B73"/>
    </linearGradient>
    <linearGradient id="rightCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9A3F45"/>
      <stop offset="1" stop-color="#C45B4F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#173B3A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1455" cy="85" r="190" fill="#DDEBE5" opacity="0.7"/>
  <circle cx="95" cy="925" r="170" fill="#F1DCD4" opacity="0.75"/>

  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="100" y="80" font-size="25" font-weight="700" letter-spacing="2" fill="#0B5D61">FONDAZIONE COINSIEME ETS  ·  ANALISI</text>
    <text x="100" y="153" font-size="58" font-weight="800" fill="#163B3A">Il non profit cresce.</text>
    <text x="100" y="220" font-size="58" font-weight="800" fill="#A94449">L’inclusione rallenta.</text>
    <text x="100" y="268" font-size="25" fill="#405B58">La crescita dell’occupazione non riguarda tutti allo stesso modo.</text>

    <!-- Left: general employment -->
    <g filter="url(#shadow)">
      <rect x="100" y="325" width="665" height="430" rx="34" fill="url(#leftCard)"/>
    </g>
    <rect x="135" y="360" width="230" height="44" rx="22" fill="#E4F3EE" opacity="0.96"/>
    <text x="250" y="390" text-anchor="middle" font-size="19" font-weight="800" letter-spacing="1" fill="#0B5D61">CRESCITA GENERALE</text>

    <text x="145" y="505" font-size="82" font-weight="800" fill="#FFFFFF">+2,8%</text>
    <text x="145" y="548" font-size="25" font-weight="700" fill="#D8F0E7">DIPENDENTI DEL NON PROFIT</text>
    <text x="145" y="612" font-size="43" font-weight="800" fill="#FFFFFF">938.152 occupati</text>
    <text x="145" y="657" font-size="22" fill="#D8F0E7">in Italia nel 2024</text>

    <!-- Growth icon -->
    <g transform="translate(520 432)">
      <path d="M0 175 L75 110 L132 143 L225 42" fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M181 42 H225 V86" fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="27" cy="238" r="27" fill="#F3C76B"/>
      <path d="M-5 310 Q27 250 59 310" fill="#F3C76B"/>
      <circle cx="112" cy="225" r="27" fill="#F3C76B"/>
      <path d="M80 310 Q112 237 144 310" fill="#F3C76B"/>
      <circle cx="198" cy="207" r="27" fill="#F3C76B"/>
      <path d="M166 310 Q198 219 230 310" fill="#F3C76B"/>
    </g>

    <!-- Right: disadvantaged employment -->
    <g filter="url(#shadow)">
      <rect x="835" y="325" width="665" height="430" rx="34" fill="url(#rightCard)"/>
    </g>
    <rect x="870" y="360" width="315" height="44" rx="22" fill="#FFF0EB" opacity="0.98"/>
    <text x="1028" y="390" text-anchor="middle" font-size="19" font-weight="800" letter-spacing="1" fill="#9A3F45">INCLUSIONE LAVORATIVA</text>

    <text x="880" y="505" font-size="82" font-weight="800" fill="#FFFFFF">−0,9%</text>
    <text x="880" y="548" font-size="24" font-weight="700" fill="#FFE5DD">LAVORATORI SVANTAGGIATI*</text>
    <text x="880" y="612" font-size="40" font-weight="800" fill="#FFFFFF">29.225  →  28.951</text>
    <text x="880" y="657" font-size="22" fill="#FFE5DD">dal 2023 al 2024</text>

    <!-- Inclusion icon: worker, wheelchair, flat/down line -->
    <g transform="translate(1240 442)">
      <path d="M0 68 H180 L232 102" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
      <path d="M209 102 H232 V78" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
      <circle cx="62" cy="165" r="25" fill="#F5C97A"/>
      <path d="M38 205 H87 L104 251 H160" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M61 204 V253" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
      <circle cx="78" cy="270" r="45" fill="none" stroke="#FFFFFF" stroke-width="13"/>
      <circle cx="185" cy="188" r="24" fill="#F5C97A"/>
      <path d="M185 214 V275 M149 239 L185 223 L219 246 M185 275 L155 319 M185 275 L222 316" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M224 238 L240 317" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    </g>

    <!-- Interpretation strip -->
    <rect x="100" y="800" width="1400" height="105" rx="25" fill="#173B3A"/>
    <text x="800" y="844" text-anchor="middle" font-size="23" font-weight="700" letter-spacing="0.5" fill="#BFE0D5">LA DOMANDA DI COINSIEME</text>
    <text x="800" y="882" text-anchor="middle" font-size="30" font-weight="800" fill="#FFFFFF">Il lavoro cresce. Ma crescono davvero le opportunità per chi parte più indietro?</text>

    <text x="100" y="950" font-size="17" fill="#536A67">Fonti: ISTAT, Registro delle istituzioni non profit 2024; INPS, Osservatorio delle politiche occupazionali, dati 2024.</text>
    <text x="100" y="978" font-size="15" fill="#6C7E7B">* Beneficiari medi dello specifico sgravio INPS: il dato non comprende necessariamente tutti gli inserimenti delle cooperative sociali di tipo B.</text>
  </g>
</svg>
