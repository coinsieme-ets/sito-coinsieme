backend:
  name: github
  repo: coinsieme-ets/sito-coinsieme
  branch: main
  base_url: https://coinsieme-cms-oauth.coinonlus.workers.dev
  auth_endpoint: auth

local_backend:
  url: "http://localhost:8081/api/v1"

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

publish_mode: editorial_workflow

collections:
  - name: "pag_istituzionale"
    label: "Pagine Istituzionali"
    extension: "json"
    format: "json"
    files:
      - file: "content/pagine/chi-siamo.json"
        label: "Chi Siamo"
        name: "chi_siamo"
        fields:
          - { label: "Titolo Pagina", name: "title", widget: "string" }
          - { label: "Descrizione Hero", name: "subtitle", widget: "text" }
          - { label: "Contenuto Principale", name: "body", widget: "markdown" }

      - file: "content/pagine/cosa-facciamo.json"
        label: "Cosa Facciamo"
        name: "cosa_facciamo"
        fields:
          - { label: "Titolo Pagina", name: "title", widget: "string" }
          - { label: "Descrizione Hero", name: "subtitle", widget: "text" }
          - { label: "Contenuto Principale", name: "body", widget: "markdown" }

      - file: "content/pagine/domotica.json"
        label: "Domotica"
        name: "domotica"
        fields:
          - { label: "Titolo Pagina", name: "title", widget: "string" }
          - { label: "Descrizione Hero", name: "subtitle", widget: "text" }
          - { label: "Contenuto Principale", name: "body", widget: "markdown" }

      - file: "content/pagine/persone-famiglie.json"
        label: "Persone e Famiglie"
        name: "persone_famiglie"
        fields:
          - { label: "Titolo Pagina", name: "title", widget: "string" }
          - { label: "Descrizione Hero", name: "subtitle", widget: "text" }
          - { label: "Contenuto Principale", name: "body", widget: "markdown" }

      - file: "content/pagine/trasparenza.json"
        label: "Trasparenza"
        name: "trasparenza"
        fields:
          - { label: "Titolo Pagina", name: "title", widget: "string" }
          - { label: "Descrizione Hero", name: "subtitle", widget: "text" }
          - { label: "Contenuto Principale", name: "body", widget: "markdown" }

      - file: "content/pagine/contatti.json"
        label: "Contatti"
        name: "contatti"
        fields:
          - { label: "Titolo Pagina", name: "title", widget: "string" }
          - { label: "Descrizione Hero", name: "subtitle", widget: "text" }
          - { label: "Contenuto Principale", name: "body", widget: "markdown" }

  - name: "pubblicazioni"
    label: "Pubblicazioni ed E-book"
    folder: "content/pubblicazioni"
    extension: "json"
    format: "json"
    create: true
    slug: "{{title}}"
    fields:
      - { label: "Titolo Pubblicazione", name: "title", widget: "string" }
      - { label: "Tipo Documento", name: "type", widget: "string" }
      - { label: "Descrizione", name: "description", widget: "text", required: false }
      - { label: "Link PDF Allegato", name: "pdf_file", widget: "file", required: false }

  - name: "articoli"
    label: "Articoli"
    label_singular: "Articolo"
    folder: "content/articoli"
    extension: "json"
    format: "json"
    create: true
    slug: "{{title}}"
    summary: "{{title}}"
    sortable_fields:
      - "date"
      - "title"
      - "author"
    fields:
      - { label: "Titolo", name: "title", widget: "string", required: true }
      - label: "Rubrica Tematica"
        name: "category"
        widget: "select"
        required: true
        default: "Articolo"
        options:
          - { label: "Articolo generale", value: "Articolo" }
          - { label: "Accessibilità & Digitale", value: "Accessibilità & Digitale" }
          - { label: "Domotica & Innovazione", value: "Domotica & Innovazione" }
          - { label: "Normativa & Diritti Europei", value: "Normativa & Diritti Europei" }
          - { label: "Inclusione & Lavoro", value: "Inclusione & Lavoro" }
          - { label: "Lavoro & Tecnologie", value: "Lavoro & Tecnologie" }
          - { label: "Turismo & Accessibilità", value: "Turismo & Accessibilità" }
          - { label: "Storia & Radici CO.IN.", value: "Storia & Radici CO.IN." }
          - { label: "Memoria & Testimonianze", value: "Memoria & Testimonianze" }
      - label: "Tipo di Contenuto"
        name: "content_type"
        widget: "select"
        required: true
        default: "Approfondimento"
        options:
          - { label: "Approfondimento", value: "Approfondimento" }
          - { label: "Novità / Comunicato", value: "Novità" }
          - { label: "Guida pratica", value: "Guida pratica" }
          - { label: "Bando / Opportunità", value: "Bando" }
          - { label: "Intervista / Testimonianza", value: "Intervista" }
      - { label: "Sintesi", name: "summary", widget: "text", required: true }
      - { label: "Testo dell'articolo", name: "body", widget: "markdown", required: true }
      - { label: "Autore", name: "author", widget: "string", required: false }
      - label: "Data di pubblicazione"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "DD/MM/YYYY"
        time_format: false
        required: false
        hint: "Se non compilata, verrà assegnata automaticamente la data di oggi."
      - { label: "Immagine (opzionale)", name: "image", widget: "image", required: false, hint: "Foto per l'articolo (JPG, PNG, WebP o foto iPhone)." }
      - label: "Testo alternativo immagine"
        name: "image_alt"
        widget: "string"
        required: false
        hint: "Se l'immagine comunica informazioni utili, descrivi brevemente ciò che mostra. Non ripetere semplicemente il titolo dell'articolo."
      - label: "Focalizzazione / Posizione immagine (opzionale)"
        name: "image_position"
        widget: "select"
        required: false
        hint: "Scegli la focalizzazione del ritaglio (es. Alto per ritratti di persone, Centro per paesaggi)."
        options:
          - { label: "Alto (Consigliato per volti/ritratti)", value: "center 20%" }
          - { label: "Centro", value: "center center" }
          - { label: "Basso", value: "center bottom" }
          - { label: "Sinistra", value: "left center" }
          - { label: "Destra", value: "right center" }
        default: "center 20%"

  - name: "trasparenza"
    label: "Documenti di Trasparenza"
    folder: "content/trasparenza"
    extension: "json"
    format: "json"
    media_folder: "assets/documenti/trasparenza"
    public_folder: "/assets/documenti/trasparenza"
    create: true
    slug: "{{title}}"
    fields:
      - { label: "Titolo Atto / Bilancio", name: "title", widget: "string" }
      - { label: "Anno di Riferimento", name: "year", widget: "string" }
      - { label: "PDF Trasparenza", name: "document", widget: "file" }
