name: Pubblica singola segnalazione verificata
on:
  workflow_dispatch:
    inputs:
      record_id:
        description: ID della sola segnalazione da pubblicare
        required: true
        type: string
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  publish:
    uses: ./.github/workflows/sync-rassegna.yml
    with:
      record_id: ${{ inputs.record_id }}
    secrets: inherit
