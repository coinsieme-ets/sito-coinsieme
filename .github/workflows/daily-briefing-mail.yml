name: Invio Briefing Quotidiano Rassegna News (6:30 Italiane)

on:
  push:
    branches:
      - main
  schedule:
    - cron: '30 4,5 * * *' # 04:30 UTC (CEST / Estate) e 05:30 UTC (CET / Inverno) -> 06:30 Europe/Rome
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Raccogli e proponi nuove notizie candidate da feed autorevoli
        env:
          AIRTABLE_PERSONAL_ACCESS_TOKEN: ${{ secrets.AIRTABLE_PERSONAL_ACCESS_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME || 'Notizie' }}
        run: node scripts/fetch-rassegna-rss.js

      - name: Invia Briefing Mail alle 6:30 Europe/Rome (con Anti-Duplicato)
        env:
          AIRTABLE_PERSONAL_ACCESS_TOKEN: ${{ secrets.AIRTABLE_PERSONAL_ACCESS_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME || 'Notizie' }}
          AIRTABLE_VIEW_URL: ${{ secrets.AIRTABLE_VIEW_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BRIEFING_RECIPIENT_EMAIL: 'segreteria@coinsieme.it'
          BRIEFING_SENDER_EMAIL: ${{ secrets.BRIEFING_SENDER_EMAIL || 'onboarding@resend.dev' }}
          FORCE_BRIEFING: 'true'
        run: node scripts/send-briefing-mail.js

      - name: Persisti Log Dispatch Briefing nel Repository
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add content/rassegna/briefing-dispatch-log.json content/rassegna/candidati-in-attesa.json || true
          git commit -m "docs(briefing): aggiorna registro invii rassegna [skip ci]" || echo "Nessuna modifica da committare"
          git push origin main
