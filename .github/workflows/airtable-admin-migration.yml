name: Airtable Schema and Records Migration
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: airtable-segnalazioni-audit
  cancel-in-progress: false
jobs:
  audit-and-migrate:
    name: Audit in sola lettura Segnalazioni Maurizio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test verifica pubblicazione
        run: node --test scripts/verify-publication.test.js
      - name: Leggi schema e record senza modificarli
        env:
          AIRTABLE_PERSONAL_ACCESS_TOKEN: ${{ secrets.AIRTABLE_PERSONAL_ACCESS_TOKEN }}
          AIRTABLE_BASE_ID: appPqa952bdRrQJNI
        run: node scripts/airtable-audit-and-migrate.js
      - name: Conserva report con HTTP status e verifica API finale
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airtable-verification
          path: content/rassegna/airtable-full-audit.json
          if-no-files-found: error
