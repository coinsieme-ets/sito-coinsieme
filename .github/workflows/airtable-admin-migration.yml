name: Airtable Schema and Records Migration

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  audit-and-migrate:
    name: Audit PAT Permessi, Schema e Migrazione Record
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installazione dipendenze deterministica (npm ci)
        run: npm ci

      - name: Esegui Audit e Migrazione Airtable
        env:
          AIRTABLE_PERSONAL_ACCESS_TOKEN: ${{ secrets.AIRTABLE_PERSONAL_ACCESS_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID || 'appPqa952bdRrQJNI' }}
        run: node scripts/airtable-audit-and-migrate.js

      - name: Commit e Push del Report di Audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f "content/rassegna/airtable-full-audit.json" ]; then
            git add content/rassegna/airtable-full-audit.json
            git diff --staged --quiet || git commit -m "docs(airtable): aggiornamento report audit e migrazione schema [skip ci]"
            git push origin main || echo "Nessuna modifica da inviare"
          fi
