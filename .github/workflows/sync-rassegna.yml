name: Sincronizzazione Rassegna News da Airtable

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types:
      - rassegna-news-approved
      - update-rassegna
      - airtable-sync
  schedule:
    # Polling e scansione automatica ogni ora (dalle 06:15 alle 22:15 Europe/Rome -> 04:15 - 20:15 UTC)
    - cron: '15 4-20 * * *'

permissions:
  contents: write

jobs:
  sync-and-publish:
    name: Sincronizza da Airtable e Pubblica
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installazione dipendenze deterministica (npm ci)
        run: npm ci

      - name: Gestione e verifica schema Airtable
        env:
          AIRTABLE_PERSONAL_ACCESS_TOKEN: ${{ secrets.AIRTABLE_PERSONAL_ACCESS_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID || 'appPqa952bdRrQJNI' }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME || 'Notizie' }}
        run: node scripts/manage-airtable-schema.js

      - name: Raccogli e proponi nuove notizie candidate da feed autorevoli
        env:
          AIRTABLE_PERSONAL_ACCESS_TOKEN: ${{ secrets.AIRTABLE_PERSONAL_ACCESS_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME || 'Notizie' }}
        run: node scripts/fetch-rassegna-rss.js

      - name: Elabora eventuali segnalazioni dirette di Maurizio (pubblicazione immediata)
        env:
          AIRTABLE_PERSONAL_ACCESS_TOKEN: ${{ secrets.AIRTABLE_PERSONAL_ACCESS_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME || 'Notizie' }}
        run: node scripts/process-segnalazioni-maurizio.js

      - name: Sincronizza notizie approvate da Airtable
        id: sync
        env:
          AIRTABLE_PERSONAL_ACCESS_TOKEN: ${{ secrets.AIRTABLE_PERSONAL_ACCESS_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME || 'Notizie' }}
        run: node scripts/sync-rassegna.js

      - name: Compilazione pagine articoli e indici (build-cms)
        run: node scripts/build-cms.js

      - name: Verifica e validazione integrita (build-hybrid-index)
        run: node scripts/build-hybrid-index.js

      - name: Commit e Push se ci sono modifiche
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/rassegna/ index.html articoli.html
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "[CMS] Sincronizzazione automatica rassegna news approvate da Airtable"
            git pull --rebase origin main || true
            git push origin HEAD:main
          else
            echo "Nessuna modifica da salvare"
          fi

      # Il deploy resta centralizzato nel workflow principale build-articoli.yml,
      # che parte automaticamente quando questo job crea un commit su main.
