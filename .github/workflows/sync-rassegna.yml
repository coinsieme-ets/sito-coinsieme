name: Sincronizzazione Rassegna News da Airtable

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - rassegna-news-approved
      - update-rassegna
      - airtable-sync

permissions:
  contents: write

jobs:
  sync-and-publish:
    name: Sincronizza da Airtable e Pubblica
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installazione dipendenze deterministica (npm ci)
        run: npm ci

      - name: Elabora eventuali segnalazioni dirette di Maurizio (pubblicazione immediata)
        env:
          AIRTABLE_PERSONAL_ACCESS_TOKEN: ${{ secrets.AIRTABLE_PERSONAL_ACCESS_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME || 'Notizie' }}
        run: node scripts/process-segnalazioni-maurizio.js

      - name: Sincronizza notizie approvate da Airtable
        id: sync
        env:
          AIRTABLE_PERSONAL_ACCESS_TOKEN: ${{ secrets.AIRTABLE_PERSONAL_ACCESS_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME || 'Notizie' }}
        run: node scripts/sync-rassegna.js

      - name: Compilazione pagine articoli e indici (build-cms)
        run: node scripts/build-cms.js

      - name: Verifica e validazione integrita (build-hybrid-index)
        run: node scripts/build-hybrid-index.js

      - name: Commit e Push se ci sono modifiche
        id: auto-commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '[CMS] Sincronizzazione automatica rassegna news approvate da Airtable'
          file_pattern: 'content/rassegna/notizie-esterne.json index.html articoli.html'

      # Il deploy resta centralizzato nel workflow principale build-articoli.yml,
      # che parte automaticamente quando questo job crea un commit su main.
