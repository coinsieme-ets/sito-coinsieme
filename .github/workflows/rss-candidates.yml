name: Raccolta RSS in valutazione
on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
permissions:
  contents: read
concurrency:
  group: rss-candidates
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Raccogli candidati senza pubblicazione
        run: node scripts/fetch-rassegna-rss.js
      - uses: actions/upload-artifact@v4
        with:
          name: rss-candidates
          path: scratch/rss-candidates.json
          retention-days: 2
